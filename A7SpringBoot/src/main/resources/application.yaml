spring:
  application:
    name: A7SpringBoot
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  datasource:
    url: jdbc:mysql://localhost:3306/A7?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true #本地开发环境
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost  # 本地Redis
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 4KB
      location: ${java.io.tmpdir}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false  # 驼峰命名自动映射
    # 实体类扫描路径（可指定多个包）
    type-aliases-package: com.mengzhidui.a7springboot.entity

    # Mapper XML文件扫描路径（如果有XML文件）
    mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.mengzhidui.a7springboot: debug
    org.springframework.security: DEBUG

server:
    port: 9080

jwt:
  secret: ${JWT_SECRET:dev-only-change-me}
  expiration: 86400000 #1000 * 60 * 60 * 24 = 24 小时

minio:
  endpoint: http://localhost:9000  # 本地MinIO
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: default-bucket

langchain:
  service:
    url: http://localhost:9084/api/langchain
    timeout: 300000  # 5分钟超时（AI生成需要时间）